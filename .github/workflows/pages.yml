name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/wizardly-heisenberg-ppqhqj, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: node --test tests/sprintModel.test.mjs tests/jiraServer.test.mjs
      - name: Stage static site (game only; no server code)
        run: |
          mkdir -p _site
          cp -r index.html css js vendor assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
